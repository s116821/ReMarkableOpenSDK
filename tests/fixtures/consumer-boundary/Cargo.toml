[package]
name = "sdk-consumer-boundary"
edition = "2024"
rust-version = "1.88"
publish = false
autobins = false

# Deliberately a separate workspace: SDK cfg(test)/dev features cannot leak in.
[workspace]

[dependencies]
remarkable-open-sdk = { path = "../../..", default-features = false }

[[bin]]
name = "consumer"
path = "main.rs"

[[bin]]
name = "forbidden-mock"
path = "forbidden_mock.rs"

[[bin]]
name = "forbidden-development-capture"
path = "forbidden_development_capture.rs"

[[bin]]
name = "forbidden-native-adapter"
path = "forbidden_native_adapter.rs"
