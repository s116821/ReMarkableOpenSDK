[package]
name = "remarkable-open-sdk"
edition = "2024"
rust-version = "1.88"
publish = false
license = "GPL-3.0-only"
description = "Persistent identity primitives for an experimental reMarkable SDK"
include = ["/Cargo.toml", "/Cargo.lock", "/src/lib.rs", "/src/development_capture.rs", "/src/navigation.rs", "/src/navigation/gesture.rs", "/THIRD_PARTY_NOTICES.md", "/LICENSE", "/README.md"]

[features]
default = []
development-capture = ["dep:image", "dep:sha2", "dep:serde", "dep:serde_json"]

[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png"], optional = true }
sha2 = { version = "=0.10.9", optional = true }
serde = { version = "=1.0.229", features = ["derive"], optional = true }
serde_json = { version = "=1.0.151", optional = true }
