name: SDK candidate artifacts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      application: ${{ steps.paths.outputs.application }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require complete PR file observation
        if: github.event_name == 'pull_request' && !(github.event.pull_request.changed_files > 0 && github.event.pull_request.changed_files < 3000)
        shell: bash
        run: exit 1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: paths
        with:
          base: ${{ github.event.before || '' }}
          filters: .github/sdk-paths.yml
          predicate-quantifier: every
  candidate:
    needs: checks
    if: needs.checks.outputs.application == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install and audit exact maintained tool graph
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/sdk-tools"
          "$RUNNER_TEMP/sdk-tools/bin/python" -m pip install --require-hashes --only-binary=:all: -r release/python-tools.lock
          "$RUNNER_TEMP/sdk-tools/bin/pip-audit"
      - name: Calculate unofficial candidate from frozen Git history
        id: version
        shell: bash
        env:
          SOURCE: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE"
          git for-each-ref refs/tags > "$RUNNER_TEMP/tags-before"
          git checkout -B main "$SOURCE"
          tag=$("$RUNNER_TEMP/sdk-tools/bin/semantic-release" -c release/python-semantic-release.toml --strict version --print-tag --no-commit --no-tag --no-changelog --skip-build --no-push --no-vcs-release)
          CANDIDATE="$tag" python -c 'import os,re; assert re.fullmatch(r"v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)",os.environ["CANDIDATE"])'
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          test "$(git rev-parse HEAD)" = "$SOURCE"
          git for-each-ref refs/tags > "$RUNNER_TEMP/tags-after"
          cmp "$RUNNER_TEMP/tags-before" "$RUNNER_TEMP/tags-after"
          test -z "$(git status --porcelain)"
  build:
    needs: [checks, candidate]
    if: needs.checks.outputs.application == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      receipt_sha: ${{ steps.build.outputs.receipt_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: '1.98.1'
          targets: x86_64-unknown-linux-gnu,armv7-unknown-linux-gnueabihf,aarch64-unknown-linux-gnu
      - name: Build actual frozen SDK candidate outputs
        id: build
        shell: bash
        env:
          SOURCE: ${{ github.sha }}
          TAG: ${{ needs.candidate.outputs.tag }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python release/candidate_artifacts.py build --source . --sha "$SOURCE" --tag "$TAG" --output "$RUNNER_TEMP/sdk-candidate"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdk-candidate-build
          path: |
            ${{ runner.temp }}/sdk-candidate/build-receipt.json
            ${{ runner.temp }}/sdk-candidate/release/
            ${{ runner.temp }}/sdk-candidate/tests/
          if-no-files-found: error
          retention-days: 7
  integration:
    needs: [candidate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sdk-candidate-build
          path: ${{ runner.temp }}/sdk-candidate
      - name: Verify and execute exactly the retained build bytes
        shell: bash
        env:
          SOURCE: ${{ github.sha }}
          TAG: ${{ needs.candidate.outputs.tag }}
          RECEIPT: ${{ needs.build.outputs.receipt_sha }}
          SDK_CANDIDATE_FIXTURE: ${{ runner.temp }}/sdk-candidate
          SDK_CANDIDATE_RECEIPT_SHA: ${{ needs.build.outputs.receipt_sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python release/candidate_artifacts.py integration --sha "$SOURCE" --tag "$TAG" --output "$RUNNER_TEMP/sdk-candidate" --receipt-sha "$RECEIPT"
          python -m unittest discover -s release -p test_candidate_artifacts.py -v
          test -z "$(git status --porcelain)"
  result:
    if: always()
    needs: [checks, candidate, build, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Require all admitted candidate jobs
        shell: bash
        env:
          CHECKS: ${{ needs.checks.result }}
          APPLICATION: ${{ needs.checks.outputs.application }}
          CANDIDATE: ${{ needs.candidate.result }}
          BUILD: ${{ needs.build.result }}
          INTEGRATION: ${{ needs.integration.result }}
        run: |
          test "$CHECKS" = success
          if test "$APPLICATION" = true; then
            test "$CANDIDATE" = success
            test "$BUILD" = success
            test "$INTEGRATION" = success
          else
            test "$APPLICATION" = false
            test "$CANDIDATE" = skipped
            test "$BUILD" = skipped
            test "$INTEGRATION" = skipped
          fi
