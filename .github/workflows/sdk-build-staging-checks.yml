name: SDK build-staging checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  staging:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Verify source staging admission and portable identity
        shell: bash
        run: |
          python -m unittest discover -s release -p test_stage_admission.py -v
          python -m unittest discover -s release -p test_candidate_admission.py -v
          python -m unittest discover -s release -p test_portable_stage.py -v
          git diff --exit-code
        env:
          PYTHONDONTWRITEBYTECODE: '1'
