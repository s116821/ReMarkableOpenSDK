name: SDK identity checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      application: ${{ steps.paths.outputs.application }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require complete PR file observation
        if: github.event_name == 'pull_request' && !(github.event.pull_request.changed_files > 0 && github.event.pull_request.changed_files < 3000)
        run: exit 1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: paths
        with:
          base: ${{ github.event.before || '' }}
          filters: .github/sdk-paths.yml
          predicate-quantifier: every
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.21.0'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: dorny/paths-filter
          ref: ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
          path: .ci-paths-filter
          persist-credentials: false
      - name: Exercise actual maintained path classification
        run: node --test tools/ci_paths.test.mjs
        env:
          PATHS_FILTER_ACTION: ${{ github.workspace }}/.ci-paths-filter/dist/index.js
      - name: Validate specifications
        run: npx --yes @fission-ai/openspec@1.2.0 validate --all --strict --no-interactive
  identity:
    needs: checks
    if: needs.checks.outputs.application == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        toolchain: ['1.88.0', stable]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt,clippy
      - run: cargo test --locked --offline --all-features
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --offline --all-targets --all-features -- -D warnings
      - name: Verify actual current-crate consumer and package containment
        run: |
          python3 tools/check_consumer_boundary.py --toolchain '${{ matrix.toolchain }}'
          python3 tools/check_identity_package.py
          python3 tools/test_package_contents.py -v
          cargo fmt --manifest-path tests/fixtures/consumer-boundary/Cargo.toml --all -- --check
          git diff --exit-code
        env:
          PYTHONDONTWRITEBYTECODE: '1'
  result:
    if: always()
    needs: [checks, identity]
    runs-on: ubuntu-latest
    steps:
      - name: Require checks and any admitted Rust jobs
        env:
          CHECKS: ${{ needs.checks.result }}
          APPLICATION: ${{ needs.checks.outputs.application }}
          IDENTITY: ${{ needs.identity.result }}
        run: |
          test "$CHECKS" = success
          if test "$APPLICATION" = true; then
            test "$IDENTITY" = success
          else
            test "$APPLICATION" = false
            test "$IDENTITY" = skipped
          fi
