name: SDK CI
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
  push:
    branches:
      - main
# Serialize main from candidate selection through publication. PR runs stay independent.
concurrency:
  group: ${{ github.event_name == 'push' && 'sdk-main-delivery' || github.run_id }}
  cancel-in-progress: false
  queue: max
permissions:
  contents: read
  pull-requests: read
defaults:
  run:
    shell: bash
jobs:
  title:
    name: PR Title
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pr-title.yml
  checks:
    name: ${{ needs.title.outputs.body_only == 'true' && 'PR metadata (no Linux checks)' || 'Checks (Linux)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: title
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.title.result == 'success') && needs.title.outputs.body_only != 'true' }}
    outputs:
      application: ${{ steps.admission.outputs.application }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require exactly one observed main first-parent commit
        if: github.event_name == 'push'
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          SOURCE: ${{ github.sha }}
        run: |
          test "$BEFORE" != 0000000000000000000000000000000000000000
          test "$(git rev-parse --verify "$SOURCE^1")" = "$BEFORE"
          test "$(git rev-list --first-parent --count "$BEFORE..$SOURCE")" = 1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: paths
        with:
          base: ${{ github.event.before || '' }}
          filters: .github/sdk-paths.yml
          predicate-quantifier: every
        if: github.event_name == 'push'
      - name: Use the single maintained event admission
        id: admission
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ needs.title.outputs.application }}
          MAIN: ${{ steps.paths.outputs.application }}
        run: |
          if test "$EVENT" = push; then application="$MAIN"; else application="$PR"; fi
          test "$application" = true || test "$application" = false
          echo "application=$application" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dorny/paths-filter
          ref: ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
          path: .ci-paths-filter
          persist-credentials: false
      - name: Exercise actual maintained path classification
        run: node --test scripts/ci_paths.test.mjs
        env:
          PATHS_FILTER_ACTION: ${{ github.workspace }}/.ci-paths-filter/dist/index.js
      - name: Validate specifications
        run: npx --yes @fission-ai/openspec@1.2.0 validate --all --strict --no-interactive
      - name: Verify collector refusal and privacy boundaries
        run: python -m unittest discover -s scripts -p test_rm1_baseline.py -v
      - name: Check Python syntax
        run: python -m py_compile scripts/collect_rm1_baseline.py scripts/test_rm1_baseline.py
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        if: steps.admission.outputs.application == 'true'
        with:
          toolchain: 1.98.1
          components: rustfmt,clippy
      - name: Preserve MSRV tests, ordinary consumers and package boundaries once
        if: steps.admission.outputs.application == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo fetch --locked
          cargo fetch --locked --manifest-path tests/fixtures/consumer-boundary/Cargo.toml
          cargo +1.88.0 test --locked --offline --all-features
          cargo +1.98.1 fmt --all -- --check
          rustfmt --check cicd/release/sdk_consumer_probe.rs
          cargo +1.98.1 clippy --locked --offline --all-targets --all-features -- -D warnings
          python scripts/check_consumer_boundary.py --toolchain 1.88.0
          python scripts/check_consumer_boundary.py --toolchain 1.98.1
          python scripts/check_identity_package.py
          python scripts/test_package_contents.py -v
          cargo +1.98.1 fmt --manifest-path tests/fixtures/consumer-boundary/Cargo.toml --all -- --check
          git diff --exit-code
      - name: Verify Rust and Qt resident wire and owned endpoint
        if: steps.admission.outputs.application == 'true'
        env:
          RSDK_WIRE_VECTORS: ${{ runner.temp }}/resident-vectors
          RESIDENT_WIRE_VECTORS: ${{ runner.temp }}/resident-vectors
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-declarative-dev
          cargo +1.98.1 test --locked --offline --features native-adapter --test resident_wire_vectors -- --ignored
          RESIDENT_TEST_OUTPUT="$RUNNER_TEMP/resident-wire" sh native/resident/wire_test.sh
          RESIDENT_TEST_OUTPUT="$RUNNER_TEMP/resident-endpoint" sh native/resident/endpoint_test.sh
          ACTIVATION_TEST_OUTPUT="$RUNNER_TEMP/resident-activation" ACTIVATION_TEST_SANITIZERS=1 sh native/resident/activation_test.sh
          LOADED_ARTIFACT_TEST_OUTPUT="$RUNNER_TEMP/resident-artifact" sh native/resident/loaded_artifact_test.sh
          NONLAST_RELEASE_OUTPUT="$RUNNER_TEMP/native-nonlast" NONLAST_RELEASE_SANITIZERS=1 sh native/rm2_3_28_0_172/nonlast_release_test.sh
          RESIDENT_SLOT_OUTPUT="$RUNNER_TEMP/native-slot" RESIDENT_SLOT_SANITIZERS=1 sh native/rm2_3_28_0_172/resident_worker_slot_test.sh
          RESIDENT_CORE_OUTPUT="$RUNNER_TEMP/native-core" RESIDENT_CORE_SANITIZERS=1 sh native/rm2_3_28_0_172/resident_core_lifetime_test.sh
          READER_RETIREMENT_OUTPUT="$RUNNER_TEMP/native-retirement" READER_RETIREMENT_SANITIZERS=1 sh native/rm2_3_28_0_172/reader_request_retirement_test.sh
          READER_REQUEST_SCOPE_OUTPUT="$RUNNER_TEMP/native-scope" READER_REQUEST_SCOPE_SANITIZERS=1 sh native/rm2_3_28_0_172/reader_request_scope_test.sh
          INSERTION_ENTRY_OUTPUT="$RUNNER_TEMP/native-entry" INSERTION_ENTRY_SANITIZERS=1 sh native/rm2_3_28_0_172/reader_insertion_guard_entry_test.sh
          RESIDENT_MUTATION_OUTPUT="$RUNNER_TEMP/native-mutation" RESIDENT_MUTATION_SANITIZERS=1 sh native/rm2_3_28_0_172/resident_mutation_test.sh
          RESIDENT_PIPELINE_OUTPUT="$RUNNER_TEMP/native-pipeline" RESIDENT_PIPELINE_SANITIZERS=1 sh native/rm2_3_28_0_172/resident_mutation_pipeline_test.sh
          MUTATION_BACKEND_OUTPUT="$RUNNER_TEMP/native-mutation-backend" MUTATION_BACKEND_SANITIZERS=1 sh native/rm2_3_28_0_172/mutation_backend_test.sh
          INSERTION_CONDITION_OUTPUT="$RUNNER_TEMP/native-condition" INSERTION_CONDITION_SANITIZERS=1 sh native/rm2_3_28_0_172/reader_insertion_condition_test.sh
          INSERTION_PREDICATE_OUTPUT="$RUNNER_TEMP/native-predicate" sh native/rm2_3_28_0_172/reader_insertion_guard_predicate_test.sh
          ORDER_OBSERVATION_OUTPUT="$RUNNER_TEMP/native-order" ORDER_OBSERVATION_SANITIZERS=1 sh native/rm2_3_28_0_172/order_observation_test.sh
          READER_IDENTITY_CAPTURE_OUTPUT="$RUNNER_TEMP/native-identity-capture" READER_IDENTITY_CAPTURE_SANITIZERS=1 sh native/rm2_3_28_0_172/reader_identity_capture_test.sh
          READER_SOURCE_CAPTURE_OUTPUT="$RUNNER_TEMP/native-source-capture" READER_SOURCE_CAPTURE_SANITIZERS=1 sh native/rm2_3_28_0_172/reader_source_capture_test.sh
          RESIDENT_ENDPOINT_BINARY="$RUNNER_TEMP/resident-endpoint/endpoint-test" READER_SOURCE_CAPTURE_BINARY="$RUNNER_TEMP/native-source-capture/source-capture-test" RSDK_CAPTURE_IMAGE_OUTPUT="$RUNNER_TEMP/native-source-capture/consumer.png" timeout 60s cargo +1.98.1 test --locked --offline --features native-adapter --test resident_socket -- --ignored
      - name: Verify source staging admission and portable identity
        shell: bash
        run: |
          python -m unittest discover -s cicd/release -p test_stage_admission.py -v
          python -m unittest discover -s cicd/release -p test_candidate_admission.py -v
          python -m unittest discover -s cicd/release -p test_portable_stage.py -v
          python -m unittest discover -s cicd/release -p test_cargo_consumer.py -v
          python -m unittest discover -s cicd/release -p test_current_git_consumer.py -v
          git diff --exit-code
        env:
          SDK_FIXTURE_CARGO: cargo
          PYTHONDONTWRITEBYTECODE: "1"
        if: steps.admission.outputs.application == 'true'
      - name: Verify generated packages and retained artifact identities
        shell: bash
        run: |
          python -m unittest discover -s cicd/release -p test_generated_package_lock.py -v
          python -m unittest discover -s cicd/release -p test_package_inventory.py -v
          python -m unittest discover -s cicd/release -p test_verify_assets.py -v
          git diff --exit-code
        env:
          SDK_FIXTURE_CARGO: cargo
          PYTHONDONTWRITEBYTECODE: "1"
        if: steps.admission.outputs.application == 'true'
      - name: Install and audit exact maintained tool graph
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/sdk-semantic-tools"
          "$RUNNER_TEMP/sdk-semantic-tools/bin/python" -m pip install --require-hashes --only-binary=:all: -r cicd/release/python-tools.lock
          "$RUNNER_TEMP/sdk-semantic-tools/bin/pip-audit"
        if: steps.admission.outputs.application == 'true'
      - name: Verify configured semantic release policy
        shell: bash
        run: |
          "$RUNNER_TEMP/sdk-semantic-tools/bin/python" -m unittest discover -s cicd/release -p python_semantic_release_fixtures.py -v
          "$RUNNER_TEMP/sdk-semantic-tools/bin/python" -m unittest discover -s cicd/release -p test_semantic_metadata.py -v
          "$RUNNER_TEMP/sdk-semantic-tools/bin/python" -m unittest discover -s cicd/release -p test_commit_eligibility.py -v
          node --test cicd/release/release-assets.test.cjs
          git diff --exit-code
        env:
          PYTHON_SEMANTIC_RELEASE: ${{ runner.temp }}/sdk-semantic-tools/bin/semantic-release
          PYTHONDONTWRITEBYTECODE: "1"
        if: steps.admission.outputs.application == 'true'
      - name: Qualify actual compact workflow graph
        if: steps.admission.outputs.application == 'true'
        run: |
          npm ci --prefix scripts/ci-fixtures --ignore-scripts --no-audit --no-fund
          npm audit --prefix scripts/ci-fixtures --audit-level=low
          node --test scripts/ci-fixtures/pipeline.test.mjs
      - name: Require actual application main message eligibility
        if: github.event_name == 'push' && steps.admission.outputs.application == 'true'
        shell: bash
        env:
          SOURCE: ${{ github.sha }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: '"$RUNNER_TEMP/sdk-semantic-tools/bin/python" cicd/release/check_commit.py --sha "$SOURCE"'
      - name: Observe exact merged main PR without release writes
        if: github.event_name == 'push' && steps.admission.outputs.application == 'true'
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553
        with:
          script: await require('./cicd/release/release-assets.cjs')({github,context,core})
        env:
          ELIGIBILITY_ONLY: "true"
          RELEASE_SOURCE: ${{ github.sha }}
      - name: Host strict build and sanitizer-backed metadata fixtures
        run: |
          set -e
          cc -std=c11 -Wall -Wextra -Werror -pedantic scripts/rm1_input_geometry.c -o "$RUNNER_TEMP/rm1-probe"
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined scripts/rm1_input_geometry_test.c -o "$RUNNER_TEMP/rm1-fixtures"
          "$RUNNER_TEMP/rm1-fixtures"
          set +e
          "$RUNNER_TEMP/rm1-probe" --invalid > "$RUNNER_TEMP/refusal"
          status=$?
          set -e
          test "$status" = 1
          test ! -s "$RUNNER_TEMP/refusal"
        if: steps.admission.outputs.application == 'true'
      - name: Pull exact upstream compatibility compiler image
        run: docker pull ghcr.io/cross-rs/armv7-unknown-linux-gnueabihf@sha256:4a08bebb60f08d52c1885b643a768f163c7318c05f91cf119f6c02855ea52699
        if: steps.admission.outputs.application == 'true'
      - name: Compile ARMv7 and execute owned fixtures in emulator
        run: |
          mkdir "$RUNNER_TEMP/rm1-arm"
          docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=32m --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges \
            -v "$GITHUB_WORKSPACE/scripts:/source:ro" -v "$RUNNER_TEMP/rm1-arm:/output" \
            ghcr.io/cross-rs/armv7-unknown-linux-gnueabihf@sha256:4a08bebb60f08d52c1885b643a768f163c7318c05f91cf119f6c02855ea52699 \
            sh -c 'set -e; arm-linux-gnueabihf-gcc -std=c11 -Wall -Wextra -Werror -pedantic -O2 -static /source/rm1_input_geometry.c -o /output/probe; arm-linux-gnueabihf-gcc -std=c11 -Wall -Wextra -Werror -pedantic -O2 -static /source/rm1_input_geometry_test.c -o /output/fixtures; qemu-arm /output/fixtures'
          sha256sum "$RUNNER_TEMP/rm1-arm/probe"
        if: steps.admission.outputs.application == 'true'
  portable_checks:
    name: ${{ needs.title.outputs.body_only == 'true' && 'PR metadata (no Windows checks)' || 'Checks (Windows staging)' }}
    needs: [title, checks]
    if: ${{ !cancelled() && needs.checks.result == 'success' && needs.checks.outputs.application == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Verify source staging admission and portable identity
        shell: bash
        run: |
          python -m unittest discover -s cicd/release -p test_stage_admission.py -v
          python -m unittest discover -s cicd/release -p test_candidate_admission.py -v
          python -m unittest discover -s cicd/release -p test_portable_stage.py -v
          git diff --exit-code
        env:
          PYTHONDONTWRITEBYTECODE: "1"
  build:
    needs:
      - title
      - checks
      - portable_checks
    if: ${{ !cancelled() && needs.checks.result == 'success' && needs.portable_checks.result == 'success' && needs.checks.outputs.application == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      source_sha: ${{ github.sha }}
      receipt_sha: ${{ steps.build.outputs.receipt_sha }}
      artifact_id: ${{ steps.artifacts.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.98.1
          targets: x86_64-unknown-linux-gnu,armv7-unknown-linux-gnueabihf,aarch64-unknown-linux-gnu
      - name: Install the already-audited hash-locked calculator
        run: |
          python -m venv "$RUNNER_TEMP/sdk-tools"
          "$RUNNER_TEMP/sdk-tools/bin/python" -m pip install --require-hashes --only-binary=:all: -r cicd/release/python-tools.lock
      - name: Calculate unofficial candidate from frozen Git history
        id: version
        shell: bash
        env:
          SOURCE: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE"
          git for-each-ref refs/tags > "$RUNNER_TEMP/tags-before"
          git checkout -B main "$SOURCE"
          tag=$("$RUNNER_TEMP/sdk-tools/bin/semantic-release" -c cicd/release/python-semantic-release.toml --strict version --print-tag --no-commit --no-tag --no-changelog --skip-build --no-push --no-vcs-release)
          CANDIDATE="$tag" python -c 'import os,re; assert re.fullmatch(r"v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)",os.environ["CANDIDATE"])'
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          test "$(git rev-parse HEAD)" = "$SOURCE"
          git for-each-ref refs/tags > "$RUNNER_TEMP/tags-after"
          cmp "$RUNNER_TEMP/tags-before" "$RUNNER_TEMP/tags-after"
          test -z "$(git status --porcelain)"
      - name: Build actual frozen SDK candidate outputs
        id: build
        shell: bash
        env:
          SOURCE: ${{ github.sha }}
          TAG: ${{ steps.version.outputs.tag }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python cicd/release/candidate_artifacts.py build --source . --sha "$SOURCE" --tag "$TAG" --output "$RUNNER_TEMP/sdk-candidate"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sdk-candidate/build-receipt.json
            ${{ runner.temp }}/sdk-candidate/release/
            ${{ runner.temp }}/sdk-candidate/probes/
          if-no-files-found: error
          retention-days: 7
        id: artifacts
    name: ${{ needs.title.outputs.body_only == 'true' && 'PR metadata (no SDK build)' || 'Build' }}
  integration:
    needs:
      - title
      - checks
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/sdk-candidate
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
      - name: Verify and execute the retained external SDK consumer
        shell: bash
        env:
          SOURCE: ${{ needs.build.outputs.source_sha }}
          TAG: ${{ needs.build.outputs.tag }}
          RECEIPT: ${{ needs.build.outputs.receipt_sha }}
          SDK_CANDIDATE_FIXTURE: ${{ runner.temp }}/sdk-candidate
          SDK_CANDIDATE_RECEIPT_SHA: ${{ needs.build.outputs.receipt_sha }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          test "$SOURCE" = "$GITHUB_SHA"
          python cicd/release/candidate_artifacts.py integration --sha "$SOURCE" --tag "$TAG" --output "$RUNNER_TEMP/sdk-candidate" --receipt-sha "$RECEIPT"
          python -m unittest discover -s cicd/release -p test_candidate_artifacts.py -v
          test -z "$(git status --porcelain)"
    name: ${{ needs.title.outputs.body_only == 'true' && 'PR metadata (no SDK integration)' || 'Integration' }}
    if: ${{ !cancelled() && needs.checks.result == 'success' && needs.build.result == 'success' && needs.checks.outputs.application == 'true' }}
  release:
    needs: [title, checks, portable_checks, build, integration]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.portable_checks.result == 'success' && needs.checks.result == 'success' && needs.build.result == 'success' && needs.integration.result == 'success' && needs.checks.outputs.application == 'true' }}
    name: ${{ needs.title.outputs.body_only == 'true' && 'PR metadata (no SDK release)' || 'Release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read
    env:
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      RELEASE_SOURCE: ${{ github.sha }}
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: sdk
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/sdk-candidate
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - name: Revalidate exact tested build
        run: |
          test "$RELEASE_SOURCE" = "$GITHUB_SHA"
          test "$RELEASE_SOURCE" = "$BUILT_SOURCE"
          echo "EXPECTED_MANIFEST=$RUNNER_TEMP/sdk-candidate/release/manifest.json" >> "$GITHUB_ENV"
          python cicd/release/candidate_artifacts.py verify --sha "$RELEASE_SOURCE" --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/sdk-candidate" --receipt-sha "$RECEIPT"
        env:
          RECEIPT: ${{ needs.build.outputs.receipt_sha }}
          BUILT_SOURCE: ${{ needs.build.outputs.source_sha }}
      - name: Require exact merged main PR before any official tag
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: await require('./sdk/cicd/release/release-assets.cjs')({github,context,core})
        env:
          ELIGIBILITY_ONLY: 'true'
      - name: Install the already-audited maintained tagger
        run: |
          python -m venv "$RUNNER_TEMP/sdk-tools"
          "$RUNNER_TEMP/sdk-tools/bin/python" -m pip install --require-hashes --only-binary=:all: -r cicd/release/python-tools.lock
      - name: Bind official tag only after predecessor success
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE"
          git checkout -B main "$RELEASE_SOURCE"
          "$RUNNER_TEMP/sdk-tools/bin/python" cicd/release/check_commit.py --sha "$RELEASE_SOURCE"
          observed=$(git ls-remote origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")
          if test -z "$observed"; then
            candidate=$("$RUNNER_TEMP/sdk-tools/bin/semantic-release" -c cicd/release/python-semantic-release.toml --strict version --print-tag --no-commit --no-tag --no-changelog --skip-build --no-push --no-vcs-release)
            test "$candidate" = "$RELEASE_TAG"
            "$RUNNER_TEMP/sdk-tools/bin/semantic-release" -c cicd/release/python-semantic-release.toml --strict version --no-commit --no-changelog --skip-build --push --no-vcs-release
          fi
          python -c 'import os; from remote_identity import verify_remote_tag; verify_remote_tag(".",os.environ["RELEASE_TAG"],os.environ["RELEASE_SOURCE"])'
        env:
          PYTHONPATH: cicd/release
      - name: Observe exact release by tag, including an older draft
        id: lookup
        uses: octokit/graphql-action@ddde8ebb2493e79f390e6449c725c21663a67505 # v3.0.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          query: |
            query($owner: String!, $repo: String!, $tag: String!) {
              repository(owner: $owner, name: $repo) {
                release(tagName: $tag) { databaseId tagName isDraft isPrerelease releaseAssets(first: 1) { totalCount } }
              }
            }
          variables: |
            owner: ${{ github.repository_owner }}
            repo: ${{ github.event.repository.name }}
            tag: ${{ env.RELEASE_TAG }}
      - name: Validate complete exact release observation
        id: observation
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const helper = require('./sdk/cicd/release/release-assets.cjs');
            const value = helper.observe(JSON.parse(process.env.OBSERVATION),process.env.RELEASE_TAG);
            for (const [key,item] of Object.entries(value)) core.setOutput(key,item);
        env:
          OBSERVATION: ${{ steps.lookup.outputs.data }}
      - name: Create only an absent explicit draft
        id: create
        if: steps.observation.outputs.absent == 'true'
        uses: octokit/request-action@b91aabaa861c777dcdb14e2387e30eddf04619ae # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          route: POST /repos/{repo}/releases
          repo: ${{ github.repository }}
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.RELEASE_SOURCE }}
          draft: true
          prerelease: false
          generate_release_notes: true
      - name: Retain the validated exact release ID
        id: release_identity
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const helper = require('./sdk/cicd/release/release-assets.cjs');
            const id = process.env.ABSENT === 'true'
              ? helper.created(JSON.parse(process.env.CREATED),process.env.STATUS,process.env.RELEASE_TAG)
              : process.env.OBSERVED_ID;
            if (!/^[1-9][0-9]*$/.test(id)) throw new Error('Missing exact release ID');
            core.exportVariable('RELEASE_ID',id); core.setOutput('id',id);
        env:
          ABSENT: ${{ steps.observation.outputs.absent }}
          OBSERVED_ID: ${{ steps.observation.outputs.id }}
          CREATED: ${{ steps.create.outputs.data }}
          STATUS: ${{ steps.create.outputs.status }}
      - name: Download retained assets by exact release ID without writes
        id: retained
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: await require('./sdk/cicd/release/release-assets.cjs')({github,context,core})
        env:
          RETAINED_DIRECTORY: ${{ runner.temp }}/retained-before
      - name: Refuse conflicting bytes and select only missing assets
        id: missing
        run: |
          python -c 'import json,os,pathlib,shutil; from verify_assets import verify_downloaded_assets; manifest=json.load(open(os.environ["EXPECTED_MANIFEST"])); retained=pathlib.Path(os.environ["RETAINED"]); verify_downloaded_assets(manifest,retained,require_complete=False); names=[e["name"] for e in manifest["distributions"]]+["manifest.json"]; missing=[name for name in names if not (retained/name).exists()]; destination=pathlib.Path(os.environ["MISSING_DIRECTORY"]); destination.mkdir(mode=0o700); [shutil.copyfile(pathlib.Path(os.environ["BUILT_ASSETS"])/name,destination/name) for name in missing]; output=open(os.environ["GITHUB_OUTPUT"],"a"); output.write("files="+";".join(missing)+"\n")'
        env:
          PYTHONPATH: cicd/release
          RETAINED: ${{ runner.temp }}/retained-before
          BUILT_ASSETS: ${{ runner.temp }}/sdk-candidate/release
          MISSING_DIRECTORY: ${{ runner.temp }}/sdk-missing-assets
      - name: Upload only verified missing names to the exact private draft
        id: upload
        if: steps.retained.outputs.published != 'true' && steps.missing.outputs.files != ''
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # 2.11.5
        with:
          release_id: ${{ steps.release_identity.outputs.id }}
          repo_token: ${{ github.token }}
          tag: ${{ env.RELEASE_TAG }}
          target_commit: ${{ env.RELEASE_SOURCE }}
          file: ${{ runner.temp }}/sdk-missing-assets/*
          file_glob: true
          overwrite: false
          check_duplicates: true
          draft: true
          promote: false
          prerelease: false
          make_latest: false
      - name: Refuse a replacement uploader release ID
        if: steps.retained.outputs.published != 'true' && steps.missing.outputs.files != ''
        env:
          ORIGINAL_ID: ${{ steps.release_identity.outputs.id }}
          UPLOADED_ID: ${{ steps.upload.outputs.release_id }}
        run: test "$UPLOADED_ID" = "$ORIGINAL_ID"
      - name: Download full uploaded set for verification
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: await require('./sdk/cicd/release/release-assets.cjs')({github,context,core})
        env:
          REQUIRE_COMPLETE: 'true'
          RETAINED_DIRECTORY: ${{ runner.temp }}/retained-complete
      - name: Verify complete bytes and re-observe remote tag before finalization
        run: |
          python -c 'import json,os; from verify_assets import verify_downloaded_assets; verify_downloaded_assets(json.load(open(os.environ["EXPECTED_MANIFEST"])),os.environ["RETAINED"])'
          python -c 'import os; from remote_identity import verify_remote_tag; verify_remote_tag(".",os.environ["RELEASE_TAG"],os.environ["RELEASE_SOURCE"])'
        env:
          PYTHONPATH: cicd/release
          RETAINED: ${{ runner.temp }}/retained-complete
      - name: Re-observe exact release immediately before finalization
        id: final_lookup
        uses: octokit/graphql-action@ddde8ebb2493e79f390e6449c725c21663a67505 # v3.0.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          query: |
            query($owner: String!, $repo: String!, $tag: String!) {
              repository(owner: $owner, name: $repo) {
                release(tagName: $tag) { databaseId tagName isDraft isPrerelease releaseAssets(first: 1) { totalCount } }
              }
            }
          variables: |
            owner: ${{ github.repository_owner }}
            repo: ${{ github.event.repository.name }}
            tag: ${{ env.RELEASE_TAG }}
      - name: Require the same release before its final mutation
        id: final_observation
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const value = require('./sdk/cicd/release/release-assets.cjs').observe(JSON.parse(process.env.OBSERVATION),process.env.RELEASE_TAG,process.env.RELEASE_ID);
            core.setOutput('published',value.published);
        env:
          OBSERVATION: ${{ steps.final_lookup.outputs.data }}
      - name: Finalize only the verified exact draft
        if: steps.final_observation.outputs.published != 'true'
        uses: octokit/request-action@b91aabaa861c777dcdb14e2387e30eddf04619ae # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          route: PATCH /repos/{repo}/releases/{release_id}
          repo: ${{ github.repository }}
          release_id: ${{ steps.release_identity.outputs.id }}
          draft: false
          prerelease: false
          make_latest: legacy
