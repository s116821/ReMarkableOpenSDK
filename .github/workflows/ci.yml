name: SDK CI
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
  push:
    branches:
      - main
permissions:
  contents: read
  pull-requests: read
defaults:
  run:
    shell: bash
jobs:
  title:
    name: PR Title
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pr-title.yml
  checks:
    name: Checks (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: title
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.title.result == 'success') }}
    outputs:
      application: ${{ steps.admission.outputs.application }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require exactly one observed main first-parent commit
        if: github.event_name == 'push'
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          SOURCE: ${{ github.sha }}
        run: |
          test "$BEFORE" != 0000000000000000000000000000000000000000
          test "$(git rev-parse --verify "$SOURCE^1")" = "$BEFORE"
          test "$(git rev-list --first-parent --count "$BEFORE..$SOURCE")" = 1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: paths
        with:
          base: ${{ github.event.before || '' }}
          filters: .github/sdk-paths.yml
          predicate-quantifier: every
        if: github.event_name == 'push'
      - name: Use the single maintained event admission
        id: admission
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ needs.title.outputs.application }}
          MAIN: ${{ steps.paths.outputs.application }}
        run: |
          if test "$EVENT" = push; then application="$MAIN"; else application="$PR"; fi
          test "$application" = true || test "$application" = false
          echo "application=$application" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.21.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: dorny/paths-filter
          ref: ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
          path: .ci-paths-filter
          persist-credentials: false
      - name: Exercise actual maintained path classification
        run: node --test tools/ci_paths.test.mjs
        env:
          PATHS_FILTER_ACTION: ${{ github.workspace }}/.ci-paths-filter/dist/index.js
      - name: Validate specifications
        run: npx --yes @fission-ai/openspec@1.2.0 validate --all --strict --no-interactive
      - name: Verify collector refusal and privacy boundaries
        run: python -m unittest discover -s tools -p test_rm1_baseline.py -v
      - name: Check Python syntax
        run: python -m py_compile tools/collect_rm1_baseline.py tools/test_rm1_baseline.py
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        if: steps.admission.outputs.application == 'true'
        with:
          toolchain: 1.98.1
          components: rustfmt,clippy
      - name: Preserve MSRV tests, ordinary consumers and package boundaries once
        if: steps.admission.outputs.application == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo fetch --locked
          cargo fetch --locked --manifest-path tests/fixtures/consumer-boundary/Cargo.toml
          cargo +1.88.0 test --locked --offline --all-features
          cargo +1.98.1 fmt --all -- --check
          rustfmt --check release/sdk_consumer_probe.rs
          cargo +1.98.1 clippy --locked --offline --all-targets --all-features -- -D warnings
          python tools/check_consumer_boundary.py --toolchain 1.88.0
          python tools/check_consumer_boundary.py --toolchain 1.98.1
          python tools/check_identity_package.py
          python tools/test_package_contents.py -v
          cargo +1.98.1 fmt --manifest-path tests/fixtures/consumer-boundary/Cargo.toml --all -- --check
          git diff --exit-code
      - name: Verify source staging admission and portable identity
        shell: bash
        run: |
          python -m unittest discover -s release -p test_stage_admission.py -v
          python -m unittest discover -s release -p test_candidate_admission.py -v
          python -m unittest discover -s release -p test_portable_stage.py -v
          python -m unittest discover -s release -p test_cargo_consumer.py -v
          python -m unittest discover -s release -p test_current_git_consumer.py -v
          git diff --exit-code
        env:
          SDK_FIXTURE_CARGO: cargo
          PYTHONDONTWRITEBYTECODE: "1"
        if: steps.admission.outputs.application == 'true'
      - name: Verify generated packages and retained artifact identities
        shell: bash
        run: |
          python -m unittest discover -s release -p test_generated_package_lock.py -v
          python -m unittest discover -s release -p test_package_inventory.py -v
          python -m unittest discover -s release -p test_verify_assets.py -v
          git diff --exit-code
        env:
          SDK_FIXTURE_CARGO: cargo
          PYTHONDONTWRITEBYTECODE: "1"
        if: steps.admission.outputs.application == 'true'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: amannn/action-semantic-pull-request
          ref: 48f256284bd46cdaab1048c3721360e808335d50
          path: .ci-semantic-pr
          persist-credentials: false
        if: steps.admission.outputs.application == 'true'
      - name: Install and audit exact maintained tool graph
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/sdk-semantic-tools"
          "$RUNNER_TEMP/sdk-semantic-tools/bin/python" -m pip install --require-hashes --only-binary=:all: -r release/python-tools.lock
          "$RUNNER_TEMP/sdk-semantic-tools/bin/pip-audit"
        if: steps.admission.outputs.application == 'true'
      - name: Qualify actual upstream semantic CLI and current-title Action
        shell: bash
        run: |
          "$RUNNER_TEMP/sdk-semantic-tools/bin/python" -m unittest discover -s release -p python_semantic_release_fixtures.py -v
          "$RUNNER_TEMP/sdk-semantic-tools/bin/python" -m unittest discover -s release -p test_semantic_metadata.py -v
          "$RUNNER_TEMP/sdk-semantic-tools/bin/python" -m unittest discover -s release -p test_commit_eligibility.py -v
          node --test release/titles.test.mjs
          node --test release/release-assets.test.cjs
          git diff --exit-code
        env:
          PYTHON_SEMANTIC_RELEASE: ${{ runner.temp }}/sdk-semantic-tools/bin/semantic-release
          SEMANTIC_PR_ACTION: ${{ github.workspace }}/.ci-semantic-pr/dist/index.js
          PYTHONDONTWRITEBYTECODE: "1"
        if: steps.admission.outputs.application == 'true'
      - name: Qualify actual compact workflow graph
        if: steps.admission.outputs.application == 'true'
        run: |
          npm ci --prefix tools/ci-fixtures --ignore-scripts --no-audit --no-fund
          npm audit --prefix tools/ci-fixtures --audit-level=low
          node --test tools/ci-fixtures/pipeline.test.mjs
      - name: Require actual application main message eligibility
        if: github.event_name == 'push' && steps.admission.outputs.application == 'true'
        shell: bash
        env:
          SOURCE: ${{ github.sha }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: '"$RUNNER_TEMP/sdk-semantic-tools/bin/python" release/check_commit.py --sha "$SOURCE"'
      - name: Observe exact merged main PR without release writes
        if: github.event_name == 'push' && steps.admission.outputs.application == 'true'
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553
        with:
          script: await require('./release/release-assets.cjs')({github,context,core})
        env:
          ELIGIBILITY_ONLY: "true"
          RELEASE_SOURCE: ${{ github.sha }}
      - name: Host strict build and sanitizer-backed metadata fixtures
        run: |
          set -e
          cc -std=c11 -Wall -Wextra -Werror -pedantic tools/rm1_input_geometry.c -o "$RUNNER_TEMP/rm1-probe"
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined tools/rm1_input_geometry_test.c -o "$RUNNER_TEMP/rm1-fixtures"
          "$RUNNER_TEMP/rm1-fixtures"
          set +e
          "$RUNNER_TEMP/rm1-probe" --invalid > "$RUNNER_TEMP/refusal"
          status=$?
          set -e
          test "$status" = 1
          test ! -s "$RUNNER_TEMP/refusal"
        if: steps.admission.outputs.application == 'true'
      - name: Pull exact upstream compatibility compiler image
        run: docker pull ghcr.io/cross-rs/armv7-unknown-linux-gnueabihf@sha256:4a08bebb60f08d52c1885b643a768f163c7318c05f91cf119f6c02855ea52699
        if: steps.admission.outputs.application == 'true'
      - name: Compile ARMv7 and execute owned fixtures in emulator
        run: |
          mkdir "$RUNNER_TEMP/rm1-arm"
          docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=32m --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges \
            -v "$GITHUB_WORKSPACE/tools:/source:ro" -v "$RUNNER_TEMP/rm1-arm:/output" \
            ghcr.io/cross-rs/armv7-unknown-linux-gnueabihf@sha256:4a08bebb60f08d52c1885b643a768f163c7318c05f91cf119f6c02855ea52699 \
            sh -c 'set -e; arm-linux-gnueabihf-gcc -std=c11 -Wall -Wextra -Werror -pedantic -O2 -static /source/rm1_input_geometry.c -o /output/probe; arm-linux-gnueabihf-gcc -std=c11 -Wall -Wextra -Werror -pedantic -O2 -static /source/rm1_input_geometry_test.c -o /output/fixtures; qemu-arm /output/fixtures'
          sha256sum "$RUNNER_TEMP/rm1-arm/probe"
        if: steps.admission.outputs.application == 'true'
  portable_checks:
    name: Checks (Windows staging)
    needs: checks
    if: ${{ !cancelled() && needs.checks.result == 'success' && needs.checks.outputs.application == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Verify source staging admission and portable identity
        shell: bash
        run: |
          python -m unittest discover -s release -p test_stage_admission.py -v
          python -m unittest discover -s release -p test_candidate_admission.py -v
          python -m unittest discover -s release -p test_portable_stage.py -v
          git diff --exit-code
        env:
          PYTHONDONTWRITEBYTECODE: "1"
  build:
    needs:
      - checks
      - portable_checks
    if: ${{ !cancelled() && needs.checks.result == 'success' && needs.portable_checks.result == 'success' && needs.checks.outputs.application == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      source_sha: ${{ github.sha }}
      receipt_sha: ${{ steps.build.outputs.receipt_sha }}
      artifact_id: ${{ steps.artifacts.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.98.1
          targets: x86_64-unknown-linux-gnu,armv7-unknown-linux-gnueabihf,aarch64-unknown-linux-gnu
      - name: Install the already-audited hash-locked calculator
        run: |
          python -m venv "$RUNNER_TEMP/sdk-tools"
          "$RUNNER_TEMP/sdk-tools/bin/python" -m pip install --require-hashes --only-binary=:all: -r release/python-tools.lock
      - name: Calculate unofficial candidate from frozen Git history
        id: version
        shell: bash
        env:
          SOURCE: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE"
          git for-each-ref refs/tags > "$RUNNER_TEMP/tags-before"
          git checkout -B main "$SOURCE"
          tag=$("$RUNNER_TEMP/sdk-tools/bin/semantic-release" -c release/python-semantic-release.toml --strict version --print-tag --no-commit --no-tag --no-changelog --skip-build --no-push --no-vcs-release)
          CANDIDATE="$tag" python -c 'import os,re; assert re.fullmatch(r"v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)",os.environ["CANDIDATE"])'
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          test "$(git rev-parse HEAD)" = "$SOURCE"
          git for-each-ref refs/tags > "$RUNNER_TEMP/tags-after"
          cmp "$RUNNER_TEMP/tags-before" "$RUNNER_TEMP/tags-after"
          test -z "$(git status --porcelain)"
      - name: Build actual frozen SDK candidate outputs
        id: build
        shell: bash
        env:
          SOURCE: ${{ github.sha }}
          TAG: ${{ steps.version.outputs.tag }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python release/candidate_artifacts.py build --source . --sha "$SOURCE" --tag "$TAG" --output "$RUNNER_TEMP/sdk-candidate"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdk-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sdk-candidate/build-receipt.json
            ${{ runner.temp }}/sdk-candidate/release/
            ${{ runner.temp }}/sdk-candidate/probes/
          if-no-files-found: error
          retention-days: 7
        id: artifacts
    name: Build
  integration:
    needs:
      - checks
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: ${{ runner.temp }}/sdk-candidate
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
      - name: Verify and execute the retained external SDK consumer
        shell: bash
        env:
          SOURCE: ${{ needs.build.outputs.source_sha }}
          TAG: ${{ needs.build.outputs.tag }}
          RECEIPT: ${{ needs.build.outputs.receipt_sha }}
          SDK_CANDIDATE_FIXTURE: ${{ runner.temp }}/sdk-candidate
          SDK_CANDIDATE_RECEIPT_SHA: ${{ needs.build.outputs.receipt_sha }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          test "$SOURCE" = "$GITHUB_SHA"
          python release/candidate_artifacts.py integration --sha "$SOURCE" --tag "$TAG" --output "$RUNNER_TEMP/sdk-candidate" --receipt-sha "$RECEIPT"
          python -m unittest discover -s release -p test_candidate_artifacts.py -v
          test -z "$(git status --porcelain)"
    name: Integration
    if: ${{ !cancelled() && needs.checks.result == 'success' && needs.build.result == 'success' && needs.checks.outputs.application == 'true' }}
