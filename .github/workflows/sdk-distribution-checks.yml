name: SDK distribution checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      application: ${{ steps.paths.outputs.application }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require complete PR file observation
        if: github.event_name == 'pull_request' && !(github.event.pull_request.changed_files > 0 && github.event.pull_request.changed_files < 3000)
        run: exit 1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: paths
        with:
          base: ${{ github.event.before || '' }}
          filters: .github/sdk-paths.yml
          predicate-quantifier: every
  distribution:
    needs: checks
    if: needs.checks.outputs.application == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: '1.98.1'
      - name: Verify generated packages and retained artifact identities
        shell: bash
        run: |
          python -m unittest discover -s release -p test_generated_package_lock.py -v
          python -m unittest discover -s release -p test_package_inventory.py -v
          python -m unittest discover -s release -p test_verify_assets.py -v
          git diff --exit-code
        env:
          SDK_FIXTURE_CARGO: cargo
          PYTHONDONTWRITEBYTECODE: '1'
  result:
    if: always()
    needs: [checks, distribution]
    runs-on: ubuntu-latest
    steps:
      - name: Require checks and any admitted distribution controls
        shell: bash
        env:
          CHECKS: ${{ needs.checks.result }}
          APPLICATION: ${{ needs.checks.outputs.application }}
          DISTRIBUTION: ${{ needs.distribution.result }}
        run: |
          test "$CHECKS" = success
          if test "$APPLICATION" = true; then
            test "$DISTRIBUTION" = success
          else
            test "$APPLICATION" = false
            test "$DISTRIBUTION" = skipped
          fi
