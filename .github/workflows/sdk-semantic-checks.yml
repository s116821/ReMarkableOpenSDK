name: SDK semantic qualification
on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      application: ${{ steps.paths.outputs.application }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require complete PR file observation
        if: github.event_name == 'pull_request' && !(github.event.pull_request.changed_files > 0 && github.event.pull_request.changed_files < 3000)
        run: exit 1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: paths
        with:
          base: ${{ github.event.before || '' }}
          filters: .github/sdk-paths.yml
          predicate-quantifier: every
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50
        if: github.event_name == 'pull_request'
        with:
          requireScope: false
          types: ${{ steps.paths.outputs.application == 'true' && '(feat|fix|perf|build|ci|chore|refactor|test|revert)' || '(feat|fix|perf|build|ci|chore|refactor|test|revert|docs)' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
  semantic:
    needs: checks
    if: needs.checks.outputs.application == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.21.0'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: amannn/action-semantic-pull-request
          ref: 48f256284bd46cdaab1048c3721360e808335d50
          path: .ci-semantic-pr
          persist-credentials: false
      - name: Install and audit exact maintained tool graph
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/sdk-semantic-tools"
          "$RUNNER_TEMP/sdk-semantic-tools/bin/python" -m pip install --require-hashes --only-binary=:all: -r release/python-tools.lock
          "$RUNNER_TEMP/sdk-semantic-tools/bin/pip-audit"
      - name: Qualify actual upstream semantic CLI and current-title Action
        shell: bash
        run: |
          "$RUNNER_TEMP/sdk-semantic-tools/bin/python" -m unittest discover -s release -p python_semantic_release_fixtures.py -v
          "$RUNNER_TEMP/sdk-semantic-tools/bin/python" -m unittest discover -s release -p test_semantic_metadata.py -v
          "$RUNNER_TEMP/sdk-semantic-tools/bin/python" -m unittest discover -s release -p test_commit_eligibility.py -v
          node --test release/titles.test.mjs
          node --test release/release-assets.test.cjs
          git diff --exit-code
        env:
          PYTHON_SEMANTIC_RELEASE: ${{ runner.temp }}/sdk-semantic-tools/bin/semantic-release
          SEMANTIC_PR_ACTION: ${{ github.workspace }}/.ci-semantic-pr/dist/index.js
          PYTHONDONTWRITEBYTECODE: '1'
  result:
    if: always()
    needs: [checks, semantic]
    runs-on: ubuntu-latest
    steps:
      - name: Require checks and any admitted tool qualification
        shell: bash
        env:
          CHECKS: ${{ needs.checks.result }}
          APPLICATION: ${{ needs.checks.outputs.application }}
          SEMANTIC: ${{ needs.semantic.result }}
        run: |
          test "$CHECKS" = success
          if test "$APPLICATION" = true; then
            test "$SEMANTIC" = success
          else
            test "$APPLICATION" = false
            test "$SEMANTIC" = skipped
          fi
