name: Release tool qualification
on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  push:
    branches: [main, ci/rem-50-sdk-releases]
permissions:
  contents: read
  pull-requests: read
jobs:
  title-and-paths:
    outputs:
      application: ${{ steps.paths.outputs.application }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # GitHub's PR files API caps results at 3,000 files; never classify a partial list.
      - name: Require complete PR file observation
        if: ${{ !(github.event.pull_request.changed_files > 0 && github.event.pull_request.changed_files < 3000) }}
        run: |
          echo 'Missing or unsupported changed-file count; split PRs of 3,000 files or more.' >&2
          exit 1
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: paths
        with:
          filters: .github/release-paths.yml
          predicate-quantifier: every
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        with:
          requireScope: true
          types: ${{ steps.paths.outputs.application == 'true' && 'feat|fix|perf|build|ci|chore|refactor|test|revert' || 'feat|fix|perf|build|ci|chore|refactor|test|revert|docs' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
  upstream-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: release/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: release
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: dorny/paths-filter
          ref: ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
          path: .upstream/paths-filter
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: amannn/action-semantic-pull-request
          ref: 48f256284bd46cdaab1048c3721360e808335d50
          path: .upstream/semantic-pr
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: softprops/action-gh-release
          ref: efb35369e0ad2afab669f228072c1b0d510eae64
          path: .upstream/gh-release
      - run: npm test
        env:
          PATHS_FILTER_ACTION: ${{ github.workspace }}/.upstream/paths-filter/dist/index.js
          SEMANTIC_PR_ACTION: ${{ github.workspace }}/.upstream/semantic-pr/dist/index.js
          GH_RELEASE_ACTION: ${{ github.workspace }}/.upstream/gh-release/dist/index.js
        working-directory: release
      - name: Require resolved production-tool advisories
        run: npm audit --audit-level=high
        working-directory: release
  packaging-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: '1.98.1'
          targets: armv7-unknown-linux-gnueabihf,aarch64-unknown-linux-gnu
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: orhun/git-cliff-action
          ref: a9a95522b26fe6403f7bb24031f21fb573d0f5ff
          path: .upstream/git-cliff-action
      - name: Install exact upstream calculator for candidate tests
        run: bash .upstream/git-cliff-action/install.sh
        env:
          VERSION: v2.14.2
          GITHUB_API_TOKEN: ${{ github.token }}
      - name: Verify pinned calculator archive
        run: echo '24f397c733add5390fdceee3a2088588ab0d5f944ce00d34cb7029b888cf2db4  ${{ runner.temp }}/git-cliff/git-cliff-2.14.2-x86_64-unknown-linux-gnu.tar.gz' | sha256sum --check
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: rickstaa/action-create-tag
          ref: a1c7777fcb2fee4f19b0f283ba888afa11678b72
          path: .upstream/create-tag
      - name: Verify owned build, Cargo consumer and upstream tag-race fixtures
        run: python -m unittest discover -s release -p 'test_*.py' -v
        env:
          SDK_FIXTURE_CARGO: cargo
          GIT_CLIFF_BINARY: ${{ runner.temp }}/git-cliff/bin/git-cliff
          CREATE_TAG_ENTRYPOINT: ${{ github.workspace }}/.upstream/create-tag/entrypoint.sh
          PYTHONDONTWRITEBYTECODE: '1'

  actual-sdk-research:
    name: Actual experimental SDK / ${{ matrix.target }}
    needs: title-and-paths
    if: github.event_name == 'pull_request' && needs.title-and-paths.outputs.application == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, armv7-unknown-linux-gnueabihf, aarch64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: f8e729cbdaa1f2776b482e6d12eccf45457aa305
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: '1.98.1'
          targets: ${{ matrix.target }}
          components: rustfmt,clippy
      - name: Verify exact source snapshot
        run: test "$(git rev-parse HEAD)" = f8e729cbdaa1f2776b482e6d12eccf45457aa305
      - name: Host formatting, tests and warnings
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo fmt --all -- --check
          cargo test --locked --all-features
          cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Compile actual experimental Rust library
        run: cargo build --locked --all-features --lib --target ${{ matrix.target }}
      - name: Keep research source unchanged
        run: test -z "$(git status --porcelain)"
