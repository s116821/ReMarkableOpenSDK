name: RM1 baseline checks
on:
  pull_request:
  push:
    branches: [main, research/rem-49-rm1-baseline]
permissions:
  contents: read
jobs:
  owned-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Verify collector refusal and privacy boundaries
        run: python -m unittest discover -s tools -p test_rm1_baseline.py -v
      - name: Check Python syntax
        run: python -m py_compile tools/collect_rm1_baseline.py tools/test_rm1_baseline.py
