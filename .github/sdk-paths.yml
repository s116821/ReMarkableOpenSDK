# Conservative nonpublishing SDK check admission; unknown paths compile.
application:
  - '**'
  - '!README.md'
  - '!AGENTS.md'
  - '!CONTRIBUTING.md'
  - '!THIRD_PARTY_NOTICES.md'
  - '!CHANGELOG.md'
  - '!SECURITY.md'
  # The retained license inventory is executable package-check input.
  - '!docs/!(reference)/**'
  - '!docs/reference/!(dependency-license-inventory.json)'
  - '!docs/reference/*/**'
  - '!openspec/**/*.md'
